<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0f3b2e">
  <title>NAMP Session Timer</title>
  <style>
    :root {
      color-scheme: dark;
      --green-dark: #0f3b2e;
      --green-card: #145c46;
      --green-input: #1f7a5c;
      --yellow: #ffd800;
    }
    * { box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--green-dark);
      color: var(--yellow);
      margin: 0;
      min-height: 100vh;
      padding: 1.25rem;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    h1 { margin: 0.25rem 0 1rem; font-size: clamp(1.5rem, 4vw, 2rem); }
    .card {
      width: min(100%, 560px);
      margin: 0 auto 1.25rem;
      background: var(--green-card);
      padding: clamp(1rem, 3vw, 1.5rem);
      border-radius: 14px;
    }
    label { display: block; margin-top: 1rem; text-align: left; }
    input {
      width: 100%;
      padding: .7rem;
      border-radius: 8px;
      border: 1px solid transparent;
      background: var(--green-input);
      color: var(--yellow);
      margin-top: .4rem;
      font-size: 1.1rem;
    }
    button {
      min-height: 44px;
      padding: .75rem 1rem;
      border-radius: 10px;
      border: none;
      font-size: 1rem;
      cursor: pointer;
      margin: .5rem .2rem 0;
      background: var(--yellow);
      color: var(--green-dark);
      font-weight: 650;
      touch-action: manipulation;
    }
    button:focus-visible, input:focus-visible {
      outline: 3px solid #fff;
      outline-offset: 3px;
    }
    button.secondary { background: transparent; color: var(--yellow); border: 1px solid var(--yellow); }
    #phase { font-size: 1.2rem; opacity: .95; min-height: 1.6em; }
    #display {
      font-size: clamp(4rem, 16vw, 8rem);
      line-height: 1.1;
      margin: .6rem 0 1rem;
      font-variant-numeric: tabular-nums;
      font-weight: 700;
    }
    #status { min-height: 1.4em; font-size: .9rem; opacity: .85; }
    .controls { display: flex; flex-wrap: wrap; justify-content: center; gap: .25rem; }
    body.running .settings { display: none; }
    body.running h1 { display: none; }
    body.running .card { background: transparent; padding: 0; margin: 0; }
    body.running #display { margin: 1rem 0 1.25rem; }
    body.running #phase { margin-top: 1rem; }
    #warningSchedule { margin: .5rem 0 1rem; font-size: 1rem; line-height: 1.5; }
    #warningSchedule[hidden] { display: none; }
    .settings { text-align: left; }
    .settings label { display: block; }
    .check-row { display: flex !important; align-items: center; gap: .65rem; }
    .check-row input { width: 1.2rem; height: 1.2rem; margin: 0; flex: 0 0 auto; }
    .check-row span { text-align: left; }
    @media (max-width: 480px) { body { padding: .75rem; } }
  </style>
</head>
<body>
  <h1>NAMP Session Timer</h1>

  <div class="card">
    <div class="settings" id="settings">
      <label for="length">Session Length (minutes)
        <input type="number" id="length" value="8" min="1" max="240" step="1" inputmode="numeric">
      </label>
      <label for="w1">Warning 1 (minutes remaining)
        <input type="number" id="w1" value="2" min="0" max="240" step="1" inputmode="numeric">
      </label>
      <label for="w2">Warning 2 (minutes remaining)
        <input type="number" id="w2" value="1" min="0" max="240" step="1" inputmode="numeric">
      </label>
      <label class="check-row" for="showWarningTimes">
        <input type="checkbox" id="showWarningTimes">
        <span>Show warning times during the session</span>
      </label>
      <div class="controls">
        <button type="button" id="startBtn">Start</button>
        <button type="button" id="soundTestBtn" class="secondary">Enable / Test Sounds</button>
      </div>
    </div>
    <div id="phase" aria-live="polite">Idle</div>
    <div id="display" role="timer" aria-label="Time remaining">08:00</div>
    <div id="warningSchedule" aria-live="polite" hidden></div>
    <div id="status" aria-live="polite">Ready</div>
    <div class="controls">
      <button type="button" id="pauseBtn">Pause</button>
      <button type="button" id="resetBtn" class="secondary">Reset</button>
    </div>
  </div>

  <script>
    const display = document.getElementById("display");
    const phase = document.getElementById("phase");
    const status = document.getElementById("status");
    const warningSchedule = document.getElementById("warningSchedule");
    const showWarningTimes = document.getElementById("showWarningTimes");
    const lengthInput = document.getElementById("length");
    const w1Input = document.getElementById("w1");
    const w2Input = document.getElementById("w2");
    const startEnd = document.getElementById("startEnd");
    const warn1 = document.getElementById("warn1");
    const warn2 = document.getElementById("warn2");

    let timerId = null;
    let running = false;
    let paused = false;
    let deadline = 0;
    let remainingMs = 8 * 60 * 1000;
    let warningOneAt = 2 * 60;
    let warningTwoAt = 1 * 60;
    let firedWarnings = new Set();
    let completed = false;

    function secondsLeft() {
      return Math.max(0, Math.ceil(remainingMs / 1000));
    }

    function formatTime(totalSeconds) {
      const minutes = Math.floor(totalSeconds / 60);
      const seconds = totalSeconds % 60;
      return `${String(minutes).padStart(2, "0")}:${String(seconds).padStart(2, "0")}`;
    }

    function updateWarningSchedule() {
      if (!showWarningTimes.checked) {
        warningSchedule.hidden = true;
        warningSchedule.textContent = "";
        return;
      }
      const items = [];
      if (warningOneAt > 0) items.push(`Warning 1: ${formatTime(warningOneAt)} remaining`);
      if (warningTwoAt > 0) items.push(`Warning 2: ${formatTime(warningTwoAt)} remaining`);
      warningSchedule.textContent = items.join("  •  ");
      warningSchedule.hidden = items.length === 0;
    }

    function updateDisplay() {
      const total = secondsLeft();
      const minutes = Math.floor(total / 60);
      const seconds = total % 60;
      display.textContent = `${String(minutes).padStart(2, "0")}:${String(seconds).padStart(2, "0")}`;
    }

    function playSound(audio) {
      try {
        audio.currentTime = 0;
        const p = audio.play();
        if (p && typeof p.catch === "function") {
          p.catch(() => { status.textContent = "Timer running. Sound may be blocked by browser settings."; });
        }
      } catch (_) {
        status.textContent = "Timer running. Sound may be blocked by browser settings.";
      }
    }

    function stopTicker() {
      if (timerId !== null) {
        clearInterval(timerId);
        timerId = null;
      }
    }

    function startTicker() {
      stopTicker();
      timerId = setInterval(tick, 200);
    }

    function tick() {
      if (!running || paused || completed) return;

      // Use an absolute deadline rather than counting interval callbacks.
      remainingMs = Math.max(0, deadline - Date.now());
      const left = secondsLeft();

      // Trigger each warning once when the countdown crosses its threshold.
      if (!firedWarnings.has("w1") && warningOneAt > 0 && left <= warningOneAt) {
        firedWarnings.add("w1");
        playSound(warn1);
      }
      if (!firedWarnings.has("w2") && warningTwoAt > 0 && left <= warningTwoAt) {
        firedWarnings.add("w2");
        playSound(warn2);
      }

      updateDisplay();

      if (remainingMs <= 0) {
        completed = true;
        running = false;
        paused = false;
        stopTicker();
        phase.textContent = "Session Complete";
        status.textContent = "Time is up";
        document.body.classList.add("running");
        playSound(startEnd);
      }
    }


    function validSettings() {
      const length = Number.parseInt(lengthInput.value, 10);
      const w1 = Number.parseInt(w1Input.value, 10);
      const w2 = Number.parseInt(w2Input.value, 10);

      if (!Number.isInteger(length) || length < 1 || length > 240 ||
          !Number.isInteger(w1) || w1 < 0 || w1 > 240 ||
          !Number.isInteger(w2) || w2 < 0 || w2 > 240) {
        status.textContent = "Enter a session length of 1–240 minutes and warnings of 0–240 minutes.";
        return null;
      }
      if ((w1 > 0 && w1 >= length) || (w2 > 0 && w2 >= length)) {
        status.textContent = "Warning times must be shorter than the session length, or set to 0 to disable.";
        return null;
      }
      return { length, w1, w2 };
    }

    async function enableAudioFromUserGesture() {
      // iPad Safari may require audio playback to be initiated by a direct tap.
      // Briefly start each embedded sound muted, then pause it so the session
      // itself still begins silently. This does not guarantee audio if the
      // device is muted or browser restrictions remain in place.
      const sounds = [warn1, warn2, startEnd];
      const results = await Promise.all(sounds.map(async (audio) => {
        const wasMuted = audio.muted;
        try {
          audio.muted = true;
          audio.currentTime = 0;
          await audio.play();
          audio.pause();
          audio.currentTime = 0;
          audio.muted = wasMuted;
          return true;
        } catch (_) {
          audio.pause();
          audio.currentTime = 0;
          audio.muted = wasMuted;
          return false;
        }
      }));

      const allEnabled = results.every(Boolean);
      status.textContent = allEnabled
        ? "Sounds enabled. Start remains silent."
        : "Sound could not be enabled. Check iPad volume, Silent Mode, and Safari settings.";
      return allEnabled;
    }

    let soundTestRunning = false;
    let soundTestId = 0;

    function stopSoundTest() {
      soundTestId++;
      soundTestRunning = false;
      [warn1, warn2, startEnd].forEach((audio) => {
        audio.pause();
        audio.currentTime = 0;
      });
      const button = document.getElementById("soundTestBtn");
      button.textContent = "Enable / Test Sounds";
      status.textContent = "Sound test stopped.";
    }

    async function testSounds() {
      if (soundTestRunning) {
        stopSoundTest();
        return;
      }

      const enabled = await enableAudioFromUserGesture();
      if (!enabled) return;

      soundTestRunning = true;
      const thisTestId = ++soundTestId;
      const button = document.getElementById("soundTestBtn");
      button.textContent = "Stop Sound Test";

      // Play each sound in sequence. The same button stops playback at any time.
      const sounds = [
        { audio: warn1, label: "Warning 1" },
        { audio: warn2, label: "Warning 2" },
        { audio: startEnd, label: "Completion" }
      ];

      for (const item of sounds) {
        if (thisTestId !== soundTestId) return;
        status.textContent = `Testing ${item.label} sound… Tap Stop Sound Test to stop.`;
        try {
          item.audio.currentTime = 0;
          await item.audio.play();
          await new Promise((resolve, reject) => {
            const finish = () => {
              clearTimeout(timeoutId);
              item.audio.removeEventListener("ended", finish);
              resolve();
            };
            const timeoutId = setTimeout(finish, 5000);
            item.audio.addEventListener("ended", finish, { once: true });
          });
          item.audio.pause();
          item.audio.currentTime = 0;
        } catch (_) {
          if (thisTestId === soundTestId) {
            soundTestRunning = false;
            button.textContent = "Enable / Test Sounds";
            status.textContent = `${item.label} sound could not play. Check iPad audio settings.`;
          }
          return;
        }
      }

      if (thisTestId === soundTestId) {
        soundTestRunning = false;
        button.textContent = "Enable / Test Sounds";
        status.textContent = "Sound test finished.";
      }
    }

    function start() {
      const settings = validSettings();
      if (!settings) return;

      // Prime audio from the user's tap, without playing an audible start sound.
      enableAudioFromUserGesture();
      stopTicker();
      running = true;
      paused = false;
      completed = false;
      document.getElementById("pauseBtn").textContent = "Pause";
      firedWarnings = new Set();
      remainingMs = settings.length * 60 * 1000;
      warningOneAt = settings.w1 * 60;
      warningTwoAt = settings.w2 * 60;
      updateWarningSchedule();
      deadline = Date.now() + remainingMs;

      phase.textContent = "In Progress";
      status.textContent = "Timer running";
      document.body.classList.add("running");
      updateDisplay();
      startTicker();

      // Intentionally no sound when the session starts.
    }

    function pauseResume() {
      if (!running && !paused) return;

      if (!paused) {
        remainingMs = Math.max(0, deadline - Date.now());
        if (remainingMs <= 0) {
          tick();
          return;
        }
        paused = true;
        running = false;
        document.getElementById("pauseBtn").textContent = "Resume";
        stopTicker();
        phase.textContent = "Paused";
        status.textContent = "Timer paused";
        updateDisplay();
      } else {
        paused = false;
        running = true;
        document.getElementById("pauseBtn").textContent = "Pause";
        deadline = Date.now() + remainingMs;
        phase.textContent = "In Progress";
        status.textContent = "Timer running";
        startTicker();
      }
    }

    function reset() {
      stopTicker();
      running = false;
      paused = false;
      completed = false;
      document.getElementById("pauseBtn").textContent = "Pause";
      firedWarnings = new Set();
      const length = Number.parseInt(lengthInput.value, 10);
      remainingMs = Number.isInteger(length) && length > 0 && length <= 240 ? length * 60 * 1000 : 0;
      phase.textContent = "Idle";
      status.textContent = "Ready";
      document.body.classList.remove("running");
      warningOneAt = Math.max(0, Number.parseInt(w1Input.value, 10) || 0) * 60;
      warningTwoAt = Math.max(0, Number.parseInt(w2Input.value, 10) || 0) * 60;
      updateWarningSchedule();
      updateDisplay();
    }

    document.getElementById("startBtn").addEventListener("click", start);
    document.getElementById("pauseBtn").addEventListener("click", pauseResume);
    document.getElementById("resetBtn").addEventListener("click", reset);
    document.getElementById("soundTestBtn").addEventListener("click", testSounds);

    showWarningTimes.addEventListener("change", updateWarningSchedule);

    lengthInput.addEventListener("change", () => {
      if (!running && !paused && !completed) reset();
    });

    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "visible" && running && !paused) {
        tick();
        status.textContent = completed ? "Time is up" : "Timer checked after returning to this page";
      }
    });

    window.addEventListener("pageshow", () => {
      if (running && !paused) tick();
    });

    reset();
  </script>
</body>
</html>
